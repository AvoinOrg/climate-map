[build]
  # @tanstack/react-start 1.131.x uses Nitro target="netlify" and publish="dist".
  # The newer @netlify/vite-plugin-tanstack-start path starts at Start 1.132.0.
  command = "yarn run build:netlify"
  publish = "dist"

[build.environment]
  PUBLIC_COMPILED_APPLETS = "main,energy,carbon,luonnonmetsakartat"

[context."hiilikartta_deploy"]
  environment = { PUBLIC_COMPILED_APPLETS = "carbon" }

[context."luonnonmetsakartat_deploy"]
  environment = { PUBLIC_COMPILED_APPLETS = "luonnonmetsakartat" }

[context."luonnonmetsakartat-test_deploy"]
  environment = { PUBLIC_COMPILED_APPLETS = "luonnonmetsakartat" }

[context."energiakartta-test_deploy"]
  environment = { PUBLIC_COMPILED_APPLETS = "energy" }
